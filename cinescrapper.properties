[mongodb]
# Pick one of the names from [mongodb.uris]. The mapped environment variable
# contains the actual secret URI; do not put credentials in this file.
uri_profile = cloud
database = cine_info
# Used by database utilities. The scraper selects its collection by language.
collection = thamizh

[mongodb.uris]
cloud = MONGODB_URI_CLOUD_FREE
mylocal = MONGODB_URI_MYLOCAL

[scraper]
batch_size = 10
wiki_rate_limit = 1.5
apple_music_rate_limit = 2.0
rate_limit_jitter = 0.25
max_retries = 3
retry_base_delay = 2.0
retry_max_delay = 60.0
cache_ttl_seconds = 604800
request_timeout = 15.0
