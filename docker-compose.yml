services:
  mongo:
    image: mongo:7
    container_name: cinescrapper-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    profiles: ["scraper"]
    depends_on:
      mongo:
        condition: service_healthy
    command: ["--mongo-enabled"]
    environment:
      - MONGODB_URI_CLOUD_FREE
      - MONGODB_URI_MYLOCAL
      - MONGODB_URI
    volumes:
      - ./site_cache:/app/site_cache
      - ./cinescrapper.properties:/app/cinescrapper.properties:ro

volumes:
  mongo_data:
