services:
  mongo:
    image: mongo:7
    container_name: cinescrapper-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    profiles: ["scraper"]
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - "--year"
      - "${YEAR:-2026}"
      - "--log-level"
      - "${LOG_LEVEL:-INFO}"
      - "--batch-size"
      - "${BATCH_SIZE:-10}"
      - "--wiki-rate-limit"
      - "${WIKI_RATE_LIMIT:-1.5}"
      - "--apple-music-rate-limit"
      - "${APPLE_MUSIC_RATE_LIMIT:-2.0}"
      - "--rate-limit-jitter"
      - "${RATE_LIMIT_JITTER:-0.25}"
      - "--max-retries"
      - "${MAX_RETRIES:-3}"
      - "--mongo-enabled"
      - "--mongo-uri"
      - "mongodb://mongo:27017"
      - "--mongo-db"
      - "${MONGO_DB:-cinescrapper}"
      - "--mongo-collection"
      - "${MONGO_COLLECTION:-cinemas}"
    volumes:
      - ./site_cache:/app/site_cache

volumes:
  mongo_data:
