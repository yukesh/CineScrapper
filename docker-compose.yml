services:
  mongo:
    image: mongo:7
    container_name: cinescrapper-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    profiles:
      - scraper
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - "--year"
      - "${YEAR:-2026}"
      - "--log-level"
      - "${LOG_LEVEL:-INFO}"
      - "--mongo-enabled"
      - "--mongo-uri"
      - "mongodb://mongo:27017"
      - "--mongo-db"
      - "${MONGO_DB:-cinescrapper}"
      - "--mongo-collection"
      - "${MONGO_COLLECTION:-cinemas}"
    volumes:
      - ./site_cache:/app/site_cache

volumes:
  mongo_data:
